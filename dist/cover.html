<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Monarchy</title>
<style>
/* ══════════════════════════════════════════════════════════════
   20-shell.css — the only UNSCOPED stylesheet.

   Everything else is confined to `body.at-hall` or `body.at-table`
   by tools/scope-css.js. These rules have to reach across that
   line, so they live here and are deliberately few.
══════════════════════════════════════════════════════════════ */
html, body { height: 100%; margin: 0; overflow: hidden; background: #0a0705; }

/* ══ THE MOTION VOCABULARY ═════════════════════════════════
   Three curves and three durations, named, and used everywhere — so the
   hall and the table agree about what a press feels like instead of each
   sheet picking a number.

   THESE ARE NOT NEW. `--pop` is the curve already on `.seal .wax` in
   00-hall.css and `--settle` is the one already on the cloth fall; this
   block only gives them names and puts them where both halves can reach
   them, which per rule 5 is this file. The wax seal was the only control
   in the app that already had real feel, and the point of the pass is to
   spread what it was doing rather than invent a second dialect.

   WHICH CURVE WHEN, because getting this backwards is most of what makes
   motion feel wrong:

     --pop     overshoots past its target and comes back. For something
               ARRIVING or being GRABBED — it reads as life. Never for
               something leaving: an element that overshoots on its way
               out looks like it was flung.
     --settle  decelerates into its target and stops. For something
               COMING TO REST, and for every hover.
     --snap    fast, slightly eased, no overshoot. For a PRESS, which has
               to feel immediate above all else — a press that eases in
               reads as lag, and the whole value of a press state is that
               it happens the instant the finger lands. */
:root{
  --pop:    cubic-bezier(.3, 1.6, .5, 1);
  --settle: cubic-bezier(.16, .84, .24, 1);
  --snap:   cubic-bezier(.2, .9, .35, 1);
  --t-press: .07s;     /* a press must beat the eye, not animate for it */
  --t-hover: .16s;
  --t-move:  .26s;
  --t-wipe:  .22s;     /* the counterchange sweep — see BLAZON below */
}

/* ══════════════════════════════════════════════════════════════
   BLAZON — THE LOOK OF THE WHOLE APP, IN ONE PLACE
   STYLE.md is the long form. This is the part the browser reads.

   Persona 5 is recognisable from one frame because its theme IS its
   graphic system: a strict palette, one shape language, type used as
   image. Monarchy's theme is heraldry, and heraldry already is a
   graphic system — a thousand years old, with rules. So the app takes
   heraldry's rules instead of inventing a style:

     · THE TINCTURES are the palette. Nothing else. Two metals (Or,
       Argent), the colours, and Sable. The values below are
       12-heraldry.js's TINCT, copied exactly — the banners in the hall
       are painted from that table, and the chrome has to be the same
       paint. test/tincture.test.js fails the build if they drift.
     · THE RULE OF TINCTURE is the contrast rule. Metal on colour,
       colour on metal, never metal on metal or colour on colour. It
       is why a herald could read a shield across a field, and it is
       why Argent text on any colour here clears 4.5:1. Or on a colour
       only clears 3:1, so Or on a colour is for DISPLAY type only;
       Or on Sable clears 7:1 and may be any size.
     · THREE SURFACES, never mixed:
         Sable  — chrome. Every bar, button, panel, toast. Always dark,
                  whatever the table's theme, the way P5's UI is always
                  red and black whichever world it is laid over.
         Cloth  — navigation. The hall's screens, dyed the tincture of
                  the banner you took down (00-hall.css --field).
         Vellum — records. The sheet, papers, the battle mat. Sable
                  ink, and Gules for headings: RUBRICATION, the red a
                  scribe used for the parts you should find first.
     · THE BEND is the signature line — the heraldic diagonal. Anything
       that is chosen, hovered or live is COUNTERCHANGED along a bend:
       an Or band sweeps in on the diagonal and the ink flips to Sable.
       That sweep is this app's equivalent of P5's red slash, and it is
       the one piece of motion every control shares.
══════════════════════════════════════════════════════════════ */
:root{
  /* ── the tinctures (= 12-heraldry.js TINCT) ── */
  --m-gules:#a3232b; --m-azure:#27508f; --m-vert:#2b6940; --m-purpure:#67326f;
  --m-sable:#171310; --m-tenne:#8a4a1e; --m-murrey:#6d2038; --m-bleu:#5d7fa8;
  --m-or:#c9a227;    --m-argent:#ded8c8;

  /* ── the same paint, lit and shaded, for things with depth ── */
  /* shaded gold leans warm — Or darkened straight toward black goes olive */
  --m-or-hi:#ecd27a;  --m-or-lo:#86621c;
  --m-argent-hi:#f4efe2; --m-argent-lo:#a39c8b;
  --m-gules-hi:#c9443a; --m-gules-lo:#5c1016;
  --m-sable-2:#221c16;   /* a raised panel */
  --m-sable-3:#30271e;   /* a raised panel under the pointer */
  --m-sable-0:#0b0907;   /* a well, a slot, anything sunk */

  /* ── vellum: the ground a record is written on ── */
  --m-vellum:#efe4c8; --m-vellum-2:#e2d3ad; --m-vellum-3:#cdb98e;
  --m-ink:#1c140c;       /* sable ink */
  --m-ink-2:#4a3a28; --m-ink-3:#7a6a55;
  --m-rubric:var(--m-gules);

  /* ── roles: what a rule should reach for ── */
  --m-voice:var(--m-or);            /* headings, the live thing */
  --m-text:var(--m-argent);         /* reading, on chrome and cloth */
  --m-quiet:rgba(222,216,200,.56);  /* the second line */
  --m-hush:rgba(222,216,200,.34);   /* the third */
  --m-line:rgba(201,162,39,.34);    /* a hairline of gilt */
  --m-line-hi:rgba(201,162,39,.8);
  /* YOUR LIVERY. The accent the chrome wears is the field of your own arms
     — 42-shell.js sets it from them. Gules until you have any. */
  --m-house:var(--m-gules);
  --m-house-ink:var(--m-argent);

  /* ── type: four voices, and each has one job ──
       mark   the name of the thing — "Monarchy", a person's name
       cap    engraved capitals — every label, button and heading
       hand   the book's own voice — anything you read as a sentence
       tally  a number you act on — rounds, dice, counts
     The family names are the real fonts; the @font-face blocks below
     alias each one onto something every Windows machine already has
     until the real files are in src/assets/fonts. */
  --m-f-mark:'UnifrakturMaguntia','Old English Text MT','Sitka Banner',serif;
  --m-f-cap:'Cinzel','Constantia',serif;
  --m-f-hand:'Crimson Text','Sitka Text','Palatino Linotype',Georgia,serif;
  --m-f-tally:'Barlow Condensed','Bahnschrift SemiCondensed','Bahnschrift',sans-serif;
  --m-track:.2em;       /* the one letter-spacing for engraved capitals */

  /* ── the cuts: the only shapes a panel or a control may take ── */
  --m-plaque:polygon(8px 0,calc(100% - 8px) 0,100% 100%,0 100%);
  --m-cut:polygon(9px 0,100% 0,100% calc(100% - 9px),calc(100% - 9px) 100%,0 100%,0 9px);
  --m-pennon:polygon(0 0,100% 0,calc(100% - 9px) 50%,100% 100%,0 100%);
  /* a lozenge — the dice are lozengy (12-combat.css) */
  --m-lozenge:polygon(50% 0,100% 50%,50% 100%,0 50%);
  /* WAX: every commitment is a seal. The outline and the melt are shared so
     the hall's seal and the table's Roll are visibly the same wax. */
  --m-wax:polygon(50% 0%,63% 5%,77% 3%,88% 13%,96% 25%,94% 39%,100% 52%,93% 64%,
    95% 77%,84% 86%,74% 96%,60% 93%,50% 100%,38% 95%,25% 97%,15% 86%,5% 77%,8% 62%,
    0% 51%,7% 38%,4% 24%,16% 14%,25% 4%,37% 7%);
  --m-wax-melt:radial-gradient(circle at 34% 26%,#d4574a,var(--m-gules) 44%,var(--m-gules-lo) 100%);

  /* ── the counterchange. Used as the FIRST background layer, parked off
     to the right at rest (background-position 102%) and swept to 0 when
     the thing is hovered, chosen or live. See STYLE.md for the recipe. ── */
  --m-sweep:linear-gradient(115deg,var(--m-or) 0 50%,transparent calc(50% + .5px));
  /* the same cut, for a control that is ALREADY Or at rest: your livery
     sweeps over the metal instead, and the ink flips to --m-house-ink */
  --m-sweep-house:linear-gradient(115deg,var(--m-house) 0 50%,transparent calc(50% + .5px));
  --m-sweep-size:260% 100%;

  /* ── the frame: a Sable rule outside a gilt one, and corner marks at
     3px — the "layered frame" from grumkata's references. The marks sit on
     the BEND SINISTER (top right, bottom left) because --m-cut takes the
     other two corners: cuts on one diagonal, marks on the other, so a panel
     can wear both and neither eats the other. ── */
  --m-frame:inset 0 0 0 1px var(--m-sable), inset 0 0 0 2px rgba(201,162,39,.55);
  --m-marks:
    linear-gradient(var(--m-or),var(--m-or)) calc(100% - 5px) 5px / 12px 2px no-repeat,
    linear-gradient(var(--m-or),var(--m-or)) calc(100% - 5px) 5px / 2px 12px no-repeat,
    linear-gradient(var(--m-or),var(--m-or)) 5px calc(100% - 5px) / 12px 2px no-repeat,
    linear-gradient(var(--m-or),var(--m-or)) 5px calc(100% - 5px) / 2px 12px no-repeat;
  --m-lift:0 14px 34px rgba(0,0,0,.62);
}

/* ══ THE TYPE, ALIASED ═════════════════════════════════════════
   Before this, not one of these four families was ever loaded — there
   was no @font-face and no link anywhere — so 205 rules asking for
   Cinzel and Crimson Text were all quietly getting Times New Roman,
   which is most of why the app read as a web page.

   Each family is declared once here, and its src list is tried in
   order: an installed copy, then the bundled file (tools/fetch-fonts.js
   puts it in src/assets/fonts, build.js copies it beside the page),
   then a face every Windows 10/11 machine ships with. So every existing
   `font-family:'Cinzel'` rule starts working today without being
   touched, and gets the real letters the moment the files exist.

   Weight is split in two faces so a local fallback gets its REAL bold
   rather than a smeared synthetic one. Unscoped by nature: tools/
   scope-css.js passes @font-face through untouched. */
@font-face{font-family:'Cinzel';font-weight:400 599;font-display:swap;
  src:local('Cinzel'),url('assets/fonts/cinzel.woff2') format('woff2'),local('Constantia')}
@font-face{font-family:'Cinzel';font-weight:600 900;font-display:swap;
  src:local('Cinzel Bold'),url('assets/fonts/cinzel.woff2') format('woff2'),local('Constantia Bold')}
@font-face{font-family:'Crimson Text';font-weight:400 599;font-style:normal;font-display:swap;
  src:local('Crimson Text'),url('assets/fonts/crimson-text.woff2') format('woff2'),
      local('Sitka Text'),local('Palatino Linotype')}
@font-face{font-family:'Crimson Text';font-weight:400 599;font-style:italic;font-display:swap;
  src:local('Crimson Text Italic'),url('assets/fonts/crimson-text-italic.woff2') format('woff2'),
      local('Sitka Text Italic'),local('Palatino Linotype Italic')}
@font-face{font-family:'Crimson Text';font-weight:600 900;font-style:normal;font-display:swap;
  src:local('Crimson Text SemiBold'),url('assets/fonts/crimson-text-bold.woff2') format('woff2'),
      local('Palatino Linotype Bold')}
@font-face{font-family:'UnifrakturMaguntia';font-display:swap;
  src:local('UnifrakturMaguntia'),url('assets/fonts/unifraktur-maguntia.woff2') format('woff2'),
      local('Old English Text MT'),local('Sitka Banner')}
@font-face{font-family:'Barlow Condensed';font-weight:400 599;font-display:swap;
  src:local('Barlow Condensed Medium'),url('assets/fonts/barlow-condensed.woff2') format('woff2'),
      local('Bahnschrift SemiCondensed')}
@font-face{font-family:'Barlow Condensed';font-weight:600 900;font-display:swap;
  src:local('Barlow Condensed Bold'),url('assets/fonts/barlow-condensed-bold.woff2') format('woff2'),
      local('Bahnschrift SemiCondensed')}

/* ══ THE COUNTERCHANGE, AS A CLASS ═════════════════════════════
   For new markup. Existing controls get the same recipe written into
   their own (scoped) rules, because a bare class here loses to their
   two-class selectors — see rule 5 in PROJECT.md. */
.m-cc{
  background:var(--m-sweep) 102% 0 / var(--m-sweep-size) no-repeat, var(--m-sable-2);
  color:var(--m-text);
  transition:background-position var(--t-wipe) var(--settle),
             color var(--t-wipe) var(--settle), transform var(--t-press) var(--snap);
}
.m-cc:hover, .m-cc.on, .m-cc[aria-pressed="true"]{ background-position:0 0; color:var(--m-sable); }
/* the keyboard gets the same sweep plus a ring, never just the ring */
:focus-visible{ outline:2px solid var(--m-or); outline-offset:2px; }

/* ══ PRESSES ═════════════════════════════════════════════
   There was ONE `:active` rule in the entire application before this — a
   count worth recording, because it is the single biggest reason the UI
   felt dead to the hand. A control that does not move when you push it
   gives you no confirmation that the push registered, so every click is
   followed by a half-beat of waiting to see whether anything happened.
   Hover states cannot do this job: a touch or a fast click never shows
   one, and a hover tells you where the pointer is, not that you acted.

   It is deliberately tiny — one pixel down and a whisker of scale. The
   press is felt, not watched, and anything big enough to admire is big
   enough to get in the way of the fiftieth click. */
button:active:not(:disabled), [role="button"]:active { transform: translateY(1px); }
button, [role="button"] { transition: transform var(--t-press) var(--snap); }

/* ══ AND SOMEONE WHO ASKED FOR NONE OF IT ═════════════════════
   Unscoped on purpose so it reaches both halves at once. Transitions are
   cut to almost nothing rather than to zero: `transition:none` makes
   state changes snap hard enough to be their own kind of jarring, and a
   1ms transition still fires transitionend for anything listening. */
@media (prefers-reduced-motion: reduce){
  *, *::before, *::after{
    animation-duration: .01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: .01ms !important;
  }
}
#hall-app, #table-app { position: fixed; inset: 0; }
body.at-table #hall-app { display: none; }
body.at-hall  #table-app { display: none; }

/* The WebGL layers append themselves to <body>, not into either wrapper —
   gl.js (#gl), scene.js (#gl2) and 27-table-gl.js (#tgl) all do — so hiding
   the wrapper does not hide them. They belong to the table. */
body.at-hall #gl, body.at-hall #gl2, body.at-hall #tgl { display: none !important; }
/* and so do the chat dock (moved out of #table-app so it can stand over
   the field — 28-table-boot.js) and the table's own chrome of 2026-09-25:
   the toolbox dock, the GM's rail, the inspector, the muster */
body:not(.at-table) > .chatdock, body:not(.at-table) > .tbx, body:not(.at-table) > .gmr,
body:not(.at-table) > .insp, body:not(.at-table) > .muster, body:not(.at-table) > .war,
body:not(.at-table) > .tbx-pill { display: none !important; }

/* the way back, on the table */
/* ══ THE TABLE'S MENU ═════════════════════════════════════
   grumkata: "the table needs a real menu not random buttons all over the
   place [...] make it an escape key and menu button in the top left that
   THEN brings you to menu".

   There was a Back pennon in one corner and a Theme and a Fit in the other.
   Three buttons, three corners, no relationship between them, and the one
   decision that mattered — hosting — was not on this screen at all. Now
   there is a mark in the top left, Escape opens it, and everything that is
   a decision about this table is behind it.

   The mark is three bars, which is the one icon nobody has to be taught.
   `html body` because 12-combat.css opens with `*{padding:0}` scoped to
   `body.at-table *`, which outranks a bare class. */
html body .tm-open {
  position: fixed; left: 16px; top: 14px; z-index: 941; display: none;
  width: 42px; height: 38px; padding: 0; border: 0; cursor: pointer;
  flex-direction: column; align-items: center; justify-content: center; gap: 5px;
  background: var(--m-marks), var(--m-sable);
  box-shadow: inset 0 0 0 1px var(--m-line), var(--m-lift);
  clip-path: var(--m-pennon);
  transition: box-shadow var(--t-hover) var(--settle);
}
html body.at-table .tm-open { display: flex; }
html body .tm-open i {
  display: block; width: 17px; height: 2px; background: var(--m-or);
  transition: width var(--t-hover) var(--settle), background var(--t-hover) var(--settle);
}
html body .tm-open:hover { box-shadow: inset 0 0 0 1px var(--m-or), var(--m-lift); }
html body .tm-open:hover i:nth-child(2) { width: 11px; }
html body.menuing .tm-open i { background: var(--m-argent-hi); }

/* the menu itself: a scrim you can shut it on, and one card */
html body .tmenu {
  position: fixed; inset: 0; z-index: 1400; display: flex;
  align-items: flex-start; justify-content: flex-start;
  padding: 62px 0 0 16px; background: rgba(6,4,3,.52);
  animation: tm-in .16s var(--settle);
}
html body .tmenu[hidden] { display: none; }
@keyframes tm-in { from { opacity: 0 } }
html body .tm-card {
  width: 306px; padding: 0 0 6px;
  background: var(--m-marks), linear-gradient(176deg, var(--m-sable-2), var(--m-sable) 64%);
  box-shadow: var(--m-frame), var(--m-lift);
  animation: tm-card .22s var(--pop) both;
}
@keyframes tm-card { from { opacity: 0; transform: translateY(-10px) } }

html body .tm-head {
  display: flex; align-items: baseline; justify-content: space-between; gap: 10px;
  padding: 14px 16px 10px; box-shadow: inset 0 -1px 0 var(--m-line);
}
html body .tm-head b {
  font-family: var(--m-f-mark); font-weight: 400; font-size: 25px; line-height: 1;
  color: var(--m-argent-hi);
}
/* the word is the thing somebody in the room is waiting for you to read
   out, so it is set like a thing to be read out */
html body .tm-word {
  font-family: var(--m-f-cap); font-size: 15px; font-weight: 700;
  letter-spacing: .26em; color: var(--m-sable); background: var(--m-or);
  padding: 3px 4px 3px 10px; clip-path: var(--m-pennon);
}
html body .tm-who {
  padding: 8px 16px 2px; font-family: var(--m-f-cap); font-size: 9px;
  font-weight: 700; letter-spacing: var(--m-track); text-transform: uppercase;
  color: var(--m-quiet);
}
html body .tm-rows { padding: 8px 8px 0; }
html body .tm-row {
  display: block; width: 100%; text-align: left; cursor: pointer; border: 0;
  padding: 11px 14px; background: var(--m-sweep) 102% 0 / var(--m-sweep-size) no-repeat,
                                 transparent;
  transition: background-position var(--t-wipe) var(--settle),
              color var(--t-wipe) var(--settle);
}
/* THE LABEL IS THE BUTTON. It used to be a <span> inside it, and when the
   sub-notes were stripped out the span went with them — leaving every row
   inheriting the button default, which is black, on a Sable card. The type
   lives on the button itself now, so there is nothing left to fall off. */
html body .tm-row {
  font-family: var(--m-f-cap); font-size: 11.5px; font-weight: 700;
  letter-spacing: .13em; text-transform: uppercase; color: var(--m-text);
}
/* the one row that is the reason you opened the card */
html body .tm-row.is-or { color: var(--m-or); }
html body .tm-row.is-gules { color: var(--m-gules-hi); }
html body .tm-row:hover { background-position: 0 0; color: var(--m-sable); }
html body .tm-row.is-gules:hover {
  background: var(--m-gules); color: var(--m-argent-hi);
}
/* an answer to the button you just pressed, next to that button — not
   thrown across the screen in 124px type, which is what it used to be */
html body .tm-note {
  margin: 10px 14px 2px; padding: 9px 11px;
  font-family: var(--m-f-hand); font-style: italic; font-size: 14px;
  line-height: 1.45; color: var(--m-text);
  background: rgba(0,0,0,.34); box-shadow: inset 3px 0 0 var(--m-or);
}
html body .tm-note.bad { color: var(--m-gules-hi); box-shadow: inset 3px 0 0 var(--m-gules); }
html body .tm-row.busy { opacity: .5; pointer-events: none; }
html body .tm-say {
  margin: 10px 16px 6px; padding-top: 10px; box-shadow: inset 0 1px 0 var(--m-line);
  font-family: var(--m-f-hand); font-style: italic; font-size: 14px;
  color: var(--m-quiet);
}
html body .tm-say b { font-style: normal; color: var(--m-or); letter-spacing: .12em; }

/* SETTINGS, ON THE MENU'S OWN CARD (59-table-menu.js drawSettings). The
   same switches as the hall's Settings cloth, drawn the same way — a row of
   pennons with every choice in sight, the chosen one counterchanged — in the
   card's narrower measure. */
html body .tm-card.tm-set { width: 340px; max-height: calc(100vh - 80px); overflow-y: auto; }
html body .tm-grp {
  padding: 14px 16px 4px; font-family: var(--m-f-cap); font-size: 9px; font-weight: 700;
  letter-spacing: var(--m-track); text-transform: uppercase; color: var(--m-or);
}
html body .tm-opt { padding: 6px 16px 8px; }
html body .tm-opt > span {
  display: block; margin-bottom: 6px; font-family: var(--m-f-hand); font-size: 14px;
  color: var(--m-text);
}
html body .tm-chips { display: flex; flex-wrap: wrap; gap: 4px; }
html body .tm-chip {
  flex: 1 1 auto; min-width: 44px; padding: 6px 8px; border: 0; cursor: pointer;
  font-family: var(--m-f-cap); font-size: 10px; font-weight: 700; letter-spacing: .1em;
  text-transform: uppercase; color: var(--m-quiet); background: rgba(0,0,0,.34);
  box-shadow: inset 0 0 0 1px var(--m-line);
  transition: color var(--t-hover) var(--settle), box-shadow var(--t-hover) var(--settle);
}
html body .tm-chip:hover { color: var(--m-argent-hi); box-shadow: inset 0 0 0 1px var(--m-or); }
html body .tm-chip.on { color: var(--m-sable); background: var(--m-or); box-shadow: none; }
html body .tm-set .tm-rows { padding-top: 12px; }

/* ══════════════════════════════════════════════════════════════
   PAPERS — a record open at the table, on your own end.
   Unscoped because it must sit over either half, and because the
   record's own stylesheet is scoped INTO it (see build.js).
   Built from the design language's own vocabulary: a plaque that
   rides the edge, a layered frame, a patterned ground — not a
   flat panel with a hairline border.
══════════════════════════════════════════════════════════════ */
#tp {
  /* wide enough for the record at its own 900 where the window allows it;
     45-papers.js fitLeaf() scales it down where it does not */
  position: fixed; right: 316px; top: 14px; bottom: 14px; width: min(944px, calc(100vw - 340px));
  z-index: 930; display: flex; flex-direction: column;
  /* vellum, with the faint lattice every record is ruled on */
  background:
    repeating-linear-gradient(45deg, rgba(28,20,12,.04) 0 2px, transparent 2px 7px),
    repeating-linear-gradient(-45deg, rgba(28,20,12,.04) 0 2px, transparent 2px 7px),
    linear-gradient(176deg, var(--m-vellum-2) 0%, var(--m-vellum-3) 100%);
  border: 3px solid var(--m-sable);
  box-shadow: inset 0 0 0 2px var(--m-or-lo), inset 0 0 0 4px rgba(201,162,39,.45),
              0 26px 70px rgba(0,0,0,.6);
  color: var(--m-ink);
}
#tp[hidden] { display: none !important; }
/* corner marks — four, at 3px inset, per the design language */
#tp::before {
  content: ''; position: absolute; inset: 3px; pointer-events: none; z-index: 2;
  background:
    linear-gradient(var(--m-sable),var(--m-sable)) left top / 14px 2px no-repeat,
    linear-gradient(var(--m-sable),var(--m-sable)) left top / 2px 14px no-repeat,
    linear-gradient(var(--m-sable),var(--m-sable)) right bottom / 14px 2px no-repeat,
    linear-gradient(var(--m-sable),var(--m-sable)) right bottom / 2px 14px no-repeat;
}
/* the head is chrome, so it is Sable — with your livery down its edge */
.tp-head {
  flex: 0 0 auto; position: relative; height: 30px; margin: 0 0 6px;
  border-bottom: 2px solid var(--m-or-lo);
  background: var(--m-sable);
  box-shadow: inset 0 -3px 0 var(--m-house);
}
/* the title is a plaque riding ON the border, never a row inside a box */
.tp-head .plaque {
  position: absolute; left: 16px; top: 9px;
  padding: 6px 20px 5px; background: var(--m-or);
  clip-path: var(--m-plaque); color: var(--m-sable);
  font-family: var(--m-f-cap); font-size: 11px; font-weight: 700; letter-spacing: .14em;
  box-shadow: inset 0 1px 0 var(--m-or-hi);
}
.tp-x {
  position: absolute; right: 8px; top: 5px; width: 20px; height: 20px;
  display: grid; place-items: center; cursor: pointer; font-size: 10px;
  color: var(--m-quiet); background: transparent; border: 1px solid var(--m-line);
  transition: background var(--t-hover) var(--settle), color var(--t-hover) var(--settle);
}
.tp-x:hover { color: var(--m-argent-hi); background: var(--m-gules); border-color: var(--m-gules-hi); }
.tp-leaf { flex: 1; min-height: 0; overflow: auto; padding: 14px 16px 20px; }

/* choosing which record, when there is more than one */
.tp-pickers { padding: 26px 18px; display: flex; flex-direction: column; gap: 10px; }
.tp-pick {
  display: grid; grid-template-columns: 1fr auto; gap: 2px 14px; align-items: baseline;
  padding: 12px 16px; cursor: pointer; text-align: left; color: var(--m-ink);
  background: var(--m-sweep) 102% 0 / var(--m-sweep-size) no-repeat, var(--m-vellum);
  border: 2px solid var(--m-sable);
  box-shadow: inset 4px 0 0 var(--m-rubric), 0 4px 10px rgba(0,0,0,.3);
  transition: background-position var(--t-wipe) var(--settle), color var(--t-wipe) var(--settle);
}
/* on vellum the sweep is Or over ink: metal under colour, still lawful */
.tp-pick:hover { background-position: 0 0; }
.tp-pick b { font-family: var(--m-f-cap); font-size: 14px; font-weight: 600; }
.tp-pick i { grid-column: 1; font-family: var(--m-f-hand); font-size: 12px; opacity: .6; }
.tp-pick span {
  grid-row: 1 / span 2; font-family: var(--m-f-tally); font-size: 14px; font-weight: 600;
  letter-spacing: .06em; opacity: .75;
}

/* ── THE BIN: A THING ON THE TABLE ────────────────────────────
   grumkata: "take the bin and remove it from being stuck to the screen
   instead imbed it into the table just like the chest bottom left is
   prefrable". So it is a prop on the wood like the chest — 23-table3d.js
   positions it by data-x/data-y, and this element is only the invisible rect
   that 27-table-gl.js draws the real basket over. It pans, tilts and zooms
   with the table for free, and it cannot be lost off the edge of the screen
   because the camera is clamped to the table.

   It shows NOTHING of its own. grumkata: "from the bin there should be no
   ui" — no count, no badge, nothing to open. The basket is the whole of it,
   and its shadow is a real one thrown by the light in 27-table-gl.js rather
   than a soft grey oval painted under the middle of the box. */
.tb-bin { cursor: pointer; }
.tb-bin, .tb-bin .face { box-shadow: none; background: transparent; }
.tb-bin[hidden] { display: none !important; }
.tb-bin-face { position: relative; }
.tb-bin:hover { filter: brightness(1.16); }
/* the one thing it does say: that letting go here will do something */
.tb-bin.over { filter: brightness(1.34) saturate(1.5); }
.tb-bin.over .tb-bin-face::after {
  content: ''; position: absolute; inset: 8%;
  border: 2px solid #b84230; border-radius: 50%;
  box-shadow: 0 0 26px rgba(184,66,48,.6); pointer-events: none;
}

/* ══════════════════════════════════════════════════════════════
   THE HERALD — 55-herald.js's two layers. Unscoped: they cover both
   halves, and sit under only the loading screen (z 100000).
══════════════════════════════════════════════════════════════ */
#herald-gl { position: fixed; inset: 0; width: 100vw; height: 100vh;
  z-index: 99990; pointer-events: none; display: none; }
#herald-gl.on { display: block; }
/* ══ THE COVER IS NOT PART OF WHAT IT COVERS ══════════════════
   grumkata: "its laggy because your putting them on the same layer so when
   the table lags the loading screen lags even though the reason it exists is
   to mask the lag".

   That is the whole bug, stated better than any of my measurements managed.
   A loading screen that shares a rendering fate with the thing it is loading
   is not a loading screen, it is a second symptom.

   `contain` is what separates them. `paint` means nothing inside this
   element can affect anything outside it and nothing outside can invalidate
   what is inside — so the table building itself underneath, adding props,
   resizing canvases and repainting sixty thousand triangles, cannot dirty
   one pixel of the cloth on top. `layout` and `style` stop the same traffic
   going the other way. `will-change: transform` then asks for its own
   compositor layer outright, rather than hoping a heuristic offers one.

   Between them: the cover is painted once, into its own texture, and after
   that the main thread can be as busy as it likes. */
#herald { position: fixed; inset: 0; z-index: 99991; pointer-events: none;
  overflow: hidden; contain: layout paint style; will-change: transform; }
/* nothing is clicked twice through a cloth that is still moving */
#herald.wiping { pointer-events: auto; cursor: progress; }

/* ── THE CLOTH. Drawn by CSS on purpose, not as a fallback: this is one
   `transform` keyframe, so the compositor runs it on its own thread and it
   keeps moving while the main thread is blocked by the very work the cloth
   is covering. The shader version froze and then jump-cut, which is what
   grumkata saw as the transition being "basically skipped". See 55-herald.js. */
#herald .hr-veil { position: absolute; top: 0; bottom: 0; left: 0; width: 100vw;
  transform: translateX(calc(-100vw - 80vh));
  /* THE POINT OF THE WHOLE THING. Chrome only runs a transform animation on
     the compositor when the element has its own layer, and it will not give
     one to a huge clipped div on a hunch. Without this the cloth animates on
     the main thread like everything else — measured: seventeen frames painted
     during a 400ms block and two distinct pictures among them, which is a
     freeze and a jump, which is what "basically skipped" looks like. */
  will-change: transform; backface-visibility: hidden; z-index: 0; }
/* THE CLOTH: a band cut on the bend (skewed the 25 degrees every bend in the
   app runs at), wide enough that at rest it covers the screen at every row.
   Sable, woven with a diaper of gilt lozenges; a band of your livery inside
   each edge; a gilt rule on the edge itself, and outside it the DANCETTY
   teeth — a heraldic line of partition, where a plain cut would be a web
   page's. The teeth are conic-gradient triangles, painted once with the rest
   of the layer, so they cost nothing to move. */
#herald .hr-cloth { position: absolute; top: -12vh; bottom: -12vh; left: -32vh; right: -32vh;
  transform: skewX(-25deg);
  background:
    repeating-linear-gradient(45deg, rgba(201,162,39,.075) 0 1px, transparent 1px 34px),
    repeating-linear-gradient(-45deg, rgba(201,162,39,.075) 0 1px, transparent 1px 34px),
    linear-gradient(90deg, var(--m-house) 0 5vw, var(--m-sable) 5vw calc(100% - 5vw), var(--m-house) calc(100% - 5vw));
  box-shadow: inset 4px 0 0 var(--m-or), inset -4px 0 0 var(--m-or); }
#herald .hr-cloth::before, #herald .hr-cloth::after { content: ''; position: absolute; top: 0; bottom: 0; width: 16px; }
#herald .hr-cloth::before { right: 100%;
  background: conic-gradient(from 45deg at 0 50%, var(--m-or) 90deg, transparent 0) 0 0 / 16px 32px; }
#herald .hr-cloth::after { left: 100%;
  background: conic-gradient(from 225deg at 100% 50%, var(--m-or) 90deg, transparent 0) 0 0 / 16px 32px; }
/* AND EVERYTHING ELSE IN THE HERALD SITS ABOVE IT, said outright. Promoting
   the cloth to its own compositor layer (the will-change above) is what lets
   it keep moving while the main thread is blocked — and it also lifts it out
   of the plain document paint order it used to share with its siblings, so
   the title card went behind the cloth and the transition covered the screen
   in silence. Painted once, found by looking at it. */
#herald .hr-card, #herald .hr-cry, #herald .hr-sparks, #herald .hr-dust { z-index: 1; }
#herald.wiping .hr-veil { animation: hr-veil-in .42s cubic-bezier(.5,0,.85,.4) forwards; }
/* an EVEN draw off, not --settle: that curve puts two thirds of the travel in
   the first sixth of the time, so the cloth was gone in about one frame and
   the uncover read as a cut (filmed, 2026-09-26). .72s = UNCOVER in 55-herald.js */
#herald.lifting .hr-veil { animation: hr-veil-out .72s cubic-bezier(.55,0,.35,1) forwards; }
@keyframes hr-veil-in  { from { transform: translateX(calc(-100vw - 80vh)); } to { transform: translateX(0); } }
@keyframes hr-veil-out { from { transform: translateX(0); } to { transform: translateX(calc(100vw + 80vh)); } }

/* ── gold leaf rising through the cloth while it is across ── */
#herald .hr-dust { position: absolute; inset: 0; pointer-events: none; opacity: 0;
  transition: opacity .3s var(--settle); }
#herald.carded .hr-dust { opacity: 1; }
#herald .hr-dust i { position: absolute; left: var(--x); bottom: -10px; width: var(--s); height: var(--s);
  background: var(--m-or-hi); opacity: 0; transform: translateY(0) rotate(45deg);
  will-change: transform, opacity; }
#herald.wiping .hr-dust i { animation: hr-dust var(--d) linear var(--t) infinite; }
@keyframes hr-dust { 0% { opacity: 0; transform: translateY(0) rotate(45deg); }
  15% { opacity: .8; } 75% { opacity: .45; }
  100% { opacity: 0; transform: translateY(-100vh) rotate(315deg); } }

/* ── the name of where you are going, while the cloth is across ── */
#herald .hr-card { position: absolute; left: 50%; top: 50%; text-align: center; white-space: nowrap;
  transform: translate(-50%, -50%) scale(.9); opacity: 0;
  transition: opacity .18s var(--settle), transform .5s var(--pop); }
#herald.carded .hr-card { opacity: 1; transform: translate(-50%, -50%) scale(1); }
/* THE SUN behind the name — the loading screen's, turning — and YOUR ARMS
   turning in above it: the herald announcing who is arriving where */
#herald .hr-sun { position: absolute; left: 50%; top: 50%; width: 760px; height: 760px;
  margin: -380px 0 0 -380px; z-index: -1; pointer-events: none; opacity: 0;
  transition: opacity .45s var(--settle); will-change: transform; }
#herald .hr-sun svg { display: block; width: 100%; height: 100%; }
#herald.carded .hr-sun { opacity: .42; }
/* IN the sun, not above it. The card is centred on the screen and the name
   is the middle of it, so a sun centred on the card sat behind the NAME and
   your arms floated over its top edge (grumkata: "the banner floats awkwardly
   above where it usually is"). When there are arms, the sun is centred on the
   shield (half of its 154px) and the name hangs under them both. */
#herald .hr-card:has(.hr-arms:not([hidden])) .hr-sun { top: 77px; }
#herald.wiping .hr-sun { animation: hr-sun 60s linear infinite; }
@keyframes hr-sun { to { transform: rotate(360deg); } }
#herald .hr-arms { display: block; width: 128px; height: 154px; margin: 0 auto 22px; opacity: 0;
  transform: perspective(600px) rotateY(-80deg) scale(.9);
  transition: opacity .25s var(--settle), transform .7s var(--pop);
  filter: drop-shadow(0 8px 14px rgba(0,0,0,.7)); }
#herald .hr-arms[hidden] { display: none; }
#herald .hr-arms svg { display: block; width: 128px; height: 154px; }
#herald.carded .hr-arms { opacity: 1; transform: perspective(600px) rotateY(0) scale(1); }
/* the name is SLAMMED in on a slant, the one gesture the Cry already borrows */
#herald.carded .hr-card b { animation: hr-name .6s var(--pop) both; }
@keyframes hr-name { from { opacity: 0; transform: scale(1.22) skewX(-10deg); } }
#herald .hr-card b { display: block; font-family: var(--m-f-mark); font-weight: 400;
  font-size: clamp(52px, 7.4vw, 112px); line-height: 1; color: var(--m-argent-hi);
  text-shadow: 0 4px 0 rgba(0,0,0,.6), 0 0 70px rgba(0,0,0,.85); }
/* the lozenge rule again — the app's one ornament, under its names */
#herald .hr-card b::after { content: ''; display: block; width: 340px; height: 13px; margin: 20px auto 12px;
  background:
    linear-gradient(45deg, transparent 35%, var(--m-or) 35% 65%, transparent 65%) center / 13px 13px no-repeat,
    linear-gradient(90deg, transparent, var(--m-or) 36%, transparent 46%, transparent 54%, var(--m-or) 64%, transparent)
      center / 100% 1px no-repeat; }
/* ── AND ONE THING THAT NEVER STOPS ─────────────────────────
   The same trick the boot screen uses, and for the same reason: a gilt
   sweep on `transform` alone, which the compositor runs on its own thread
   and keeps running while the main thread is blocked solid by the work
   behind the cloth. It is the difference between a screen that is waiting
   and a screen that has died — and on this side of the cover, those are the
   only two things the player can tell apart. */
#herald .hr-work { display: block; width: 260px; height: 3px; margin: 22px auto 0;
  background: rgba(201,162,39,.16); overflow: hidden; position: relative;
  opacity: 0; transition: opacity .2s var(--settle); }
#herald.carded .hr-work { opacity: 1; }
#herald .hr-work::after { content: ''; position: absolute; inset: 0;
  background: linear-gradient(90deg, transparent, var(--m-or-hi), transparent);
  transform: translateX(-100%); will-change: transform;
  animation: hr-work 1.15s linear infinite; }
@keyframes hr-work { to { transform: translateX(100%) } }
@media (prefers-reduced-motion: reduce){ #herald .hr-work::after, #herald .hr-sun,
  #herald .hr-dust i, #herald.carded .hr-card b { animation: none } }

#herald .hr-card i { font-family: var(--m-f-hand); font-style: italic; font-size: 23px;
  color: var(--m-or-hi); letter-spacing: .03em; text-shadow: 0 2px 10px #000; }

/* ── THE CRY: a Sable band slammed across on a bend ──
   The hem is the tone (your livery unless the moment has its own colour)
   with gilt outside it; the title carries a hard offset shadow in the same
   tone — the one borrowed P5 gesture, in heraldic colours. */
#herald .hr-cry { position: absolute; inset: 0; }
/* absolutely placed and centred by hand: a grid will not centre an item
   wider than itself, so a 160vw band started at the left edge and the
   words ran off the right */
#herald .hr-band { --tone: var(--m-house); position: absolute; left: -30vw; width: 160vw;
  top: 50%; translate: 0 -50%; padding: 30px 0 26px;
  text-align: center;
  background:
    repeating-linear-gradient(45deg, transparent 0 17px, rgba(201,162,39,.08) 17px 18px),
    repeating-linear-gradient(-45deg, transparent 0 17px, rgba(201,162,39,.08) 17px 18px),
    var(--m-sable);
  box-shadow: 0 -10px 0 var(--tone), 0 10px 0 var(--tone),
              0 -14px 0 var(--m-or), 0 14px 0 var(--m-or),
              0 34px 90px rgba(0,0,0,.75);
  transform: rotate(-7deg);
  animation: hr-band-in .38s var(--pop) both,
             hr-band-out .34s cubic-bezier(.5,0,.85,.4) forwards;
  animation-delay: 0s, calc(.38s + var(--hold, 900ms)); }
@keyframes hr-band-in  { from { transform: rotate(-7deg) translateX(-105%) scaleY(.3); } }
@keyframes hr-band-out { to { transform: rotate(-7deg) translateX(105%) scaleY(.5); opacity: .3; } }
#herald .hr-title { display: inline-block; font-family: var(--m-f-cap); font-weight: 900;
  font-size: clamp(46px, 7.4vw, 124px); line-height: 1; letter-spacing: .12em;
  text-transform: uppercase; color: var(--m-argent-hi);
  text-shadow: .06em .06em 0 var(--tone), 0 0 40px rgba(0,0,0,.6);
  animation: hr-slam .52s var(--pop) .06s both; }
#herald .hr-title::first-letter { font-family: var(--m-f-mark); font-weight: 400; color: var(--m-or);
  font-size: 1.32em; letter-spacing: .02em; text-transform: none; }
@keyframes hr-slam { from { transform: scale(1.7) skewX(-16deg); opacity: 0; } }
#herald .hr-sub { margin-top: 10px; font-family: var(--m-f-hand); font-style: italic;
  font-size: clamp(18px, 1.9vw, 28px); color: var(--m-or-hi); letter-spacing: .03em;
  animation: hr-rise .42s var(--settle) .2s both; }
@keyframes hr-rise { from { transform: translateY(12px); opacity: 0; } }

/* ── gilt: lozenges of gold leaf thrown off a seal ── */
#herald .hr-sparks i { position: absolute; display: block; pointer-events: none;
  background: linear-gradient(135deg, var(--m-or-hi), var(--m-or) 55%, var(--m-or-lo));
  box-shadow: 0 0 7px rgba(236,210,122,.75); }

/* ══════════════════════════════════════════════════════════════
   THE SHEET ON THE WOOD (45-papers.js)

   A record is a real prop on the table now. It wears the record's own
   stylesheet — 01-sheet.css is scoped to `.tp`, which both the sheet and
   the reading carry — so what lies on the wood is the actual leaf, at the
   size a sheet of paper is on a table this big: legible as YOUR sheet,
   unreadable as words, exactly like a character sheet across a table.
══════════════════════════════════════════════════════════════ */
.tp-paper { cursor: pointer; }
/* A4 ON A TABLE MEASURED IN MILLIMETRES: 210 x 297, two units to the mm.
   The record is LAID OUT at its natural 900px and then scaled down onto
   the sheet, so what lies on the wood is the real record at the real size
   of a piece of paper — small, legible as yours, not readable as words.
   That is what picking it up is for (45-papers.js). */
.tp-paper .tp-face {
  width: 420px; height: 594px; overflow: hidden;
  background: transparent; box-shadow: none;
  /* the sheet is looked at out here, not written on: every field inside it
     belongs to the reading, which is where the pointer can reach them */
  pointer-events: none;
}
.tp-paper .tp-face > * {
  width: 900px; transform: scale(0.4667); transform-origin: top left;
}
.tp-paper .deck { padding: 0; }
.tp-paper:hover .tp-face { filter: brightness(1.06); }
/* it lifts a little under the pointer, the way a sheet does when you go for it */
.tp-paper .tp-face { transition: filter var(--t-hover) var(--settle); }

/* the table goes quiet while you are reading */
#tp-scrim {
  position: fixed; inset: 0; z-index: 925; background: rgba(6,4,3,.55);
  backdrop-filter: blur(1.5px);
}
#tp-scrim[hidden] { display: none !important; }
#tp .tp-head { display: flex; align-items: center; }
#tp .tp-x + .tp-x { right: 8px; }
#tp .tp-head .tp-x:first-of-type { right: 34px; }

/* ══ THE GRADE, IN BOTH ROOMS ══════════════════════════════════
   The table was graded — warm pool against cool shadow, halation round
   the lamp, a falloff that desaturates, and grain over the lot — and the
   hall was not, which is most of why the two 3D scenes did not feel like
   one app. The tile and the recipe live here now; each room supplies its

<style>
/* Blazon's first frame. The tokens are 20-shell.css's — that sheet is in
   <head>, so they already resolve here.

   ══ WHAT CAN MOVE WHILE THE PAGE IS BUSY ══════════════════════
   Only what the compositor can do by itself: transform and opacity, on
   their own layers. So everything that moves here — the turning shield, the
   sun, the bend, the gold leaf, the shimmer on the bar — is one of those two
   and carries on through a two-second parse freeze. The bar's own width
   cannot: it is laid out, so it advances in steps, one per script, weighted
   by bytes and eased over a long curve so that it looks deliberate. */
/* the same isolation as the Bend's cover, for the same reason: this is up
   because the page is busy, so it must not share a layer with the page */
#boot{contain:layout paint style;will-change:transform;
  position:fixed;inset:0;z-index:100000;display:flex;overflow:hidden;
  align-items:center;justify-content:center;
  background:radial-gradient(ellipse at 50% 40%,#2c1e10 0%,#150f09 44%,var(--m-sable-0,#0a0705) 80%);
  font-family:var(--m-f-hand,Georgia,serif);
  transition:opacity .5s ease}
/* the Bend's cloth, faintly: a lattice of lozenges (a diaper) over the dark */
#boot::before{content:'';position:absolute;inset:0;pointer-events:none;
  background:repeating-linear-gradient(45deg,rgba(201,162,39,.05) 0 1px,transparent 1px 40px),
             repeating-linear-gradient(-45deg,rgba(201,162,39,.05) 0 1px,transparent 1px 40px);
  -webkit-mask-image:radial-gradient(ellipse at 50% 42%,#000 12%,transparent 72%);
          mask-image:radial-gradient(ellipse at 50% 42%,#000 12%,transparent 72%)}
.boot-in{position:relative;display:flex;flex-direction:column;align-items:center;gap:18px;
  will-change:transform,opacity;
  transition:transform .62s cubic-bezier(.5,0,.85,.4),opacity .42s ease}
/* the screen lifts the way the Bend's cloth does rather than just fading:
   the same exit, so the first thing the app does and everything after it
   agree about how a cover comes off */
#boot.gone{opacity:0;pointer-events:none}
#boot.gone .boot-in{transform:translateY(-26px) scale(.97);opacity:0}

/* ── THE SUN, turning behind the shield: two of it, one large and slow, one
   larger, fainter and the other way, so the rays shimmer as they cross ── */
.boot-sun{position:absolute;left:50%;top:44%;width:620px;height:620px;transform:translate(-50%,-50%);
  pointer-events:none;opacity:.34;will-change:transform;animation:bootsun 80s linear infinite}
/* centred by translate, not margins: the hall's reset (body.at-hall *{margin:0})
   outranks a bare class and put the first sun off in a corner */
.boot-sun.far{width:1100px;height:1100px;opacity:.12;
  animation-duration:150s;animation-direction:reverse}
.boot-sun svg{display:block;width:100%;height:100%}
@keyframes bootsun{from{transform:translate(-50%,-50%) rotate(0)}to{transform:translate(-50%,-50%) rotate(360deg)}}

/* ── THE ROLL. Eight coats on one spot, each turning in on its edge, held,
   and turning away as the next comes round — the whole roll every 14.4s,
   each coat's turn 1.8s later than the last (--i). ── */
.boot-roll{position:relative;width:176px;height:252px;perspective:900px}
.boot-arms{position:absolute;left:0;top:0;width:176px;margin:0;opacity:0;
  transform:rotateY(-78deg) scale(.94);backface-visibility:hidden;will-change:transform,opacity;
  animation:bootturn 14.4s cubic-bezier(.2,.7,.2,1) infinite both;
  animation-delay:calc(var(--i) * 1.8s)}
.boot-arms svg{display:block;width:176px;height:211px;filter:drop-shadow(0 12px 18px rgba(0,0,0,.65))}
@keyframes bootturn{
  0%{opacity:0;transform:rotateY(-78deg) scale(.94)}
  2.5%{opacity:1;transform:rotateY(0) scale(1)}
  11%{opacity:1;transform:rotateY(0) scale(1)}
  13.5%{opacity:0;transform:rotateY(78deg) scale(.94)}
  100%{opacity:0;transform:rotateY(78deg) scale(.94)}}

/* ── THE COUNTERCHANGE, across the whole screen: the gilt band every hovered
   and chosen thing in the app wears, passing along the bend ── */
.boot-bend{position:absolute;top:-50%;left:0;width:26vw;height:200%;pointer-events:none;
  background:linear-gradient(90deg,transparent,rgba(236,210,122,.05) 38%,rgba(236,210,122,.11) 50%,rgba(236,210,122,.05) 62%,transparent);
  transform:translateX(-40vw) rotate(25deg);will-change:transform;
  animation:bootbend 6s cubic-bezier(.45,0,.55,1) infinite}
@keyframes bootbend{0%{transform:translateX(-40vw) rotate(25deg)}
  60%,100%{transform:translateX(125vw) rotate(25deg)}}

/* ── GOLD LEAF: the Herald's burst, slowed to a drift ── */
.boot-dust{position:absolute;inset:0;pointer-events:none}
.boot-dust i{position:absolute;left:var(--x);bottom:-12px;width:var(--s);height:var(--s);
  background:var(--m-or-hi,#ecd27a);opacity:0;transform:translateY(0) rotate(45deg);
  will-change:transform,opacity;animation:bootdust var(--d) linear var(--t) infinite}
@keyframes bootdust{0%{opacity:0;transform:translateY(0) rotate(45deg)}
  12%{opacity:.75}75%{opacity:.4}
  100%{opacity:0;transform:translateY(-104vh) rotate(315deg)}}

/* ── the name, and the lozenge rule drawing out under it ── */
.boot-name{position:relative;font-family:var(--m-f-mark,serif);font-size:58px;line-height:1;
  color:var(--m-argent-hi,#e8dfc8);letter-spacing:.02em;
  text-shadow:0 3px 0 rgba(0,0,0,.6),0 0 40px rgba(201,120,40,.35);
  will-change:transform,opacity;animation:bootname 1s cubic-bezier(.16,.84,.24,1) both}
.boot-name::after{content:'';display:block;width:240px;height:11px;margin:14px auto 0;
  background:
    linear-gradient(45deg,transparent 35%,var(--m-or,#c9a227) 35% 65%,transparent 65%) center/11px 11px no-repeat,
    linear-gradient(90deg,transparent,var(--m-or,#c9a227) 36%,transparent 46%,transparent 54%,var(--m-or,#c9a227) 64%,transparent) center/100% 1px no-repeat;
  animation:bootrule .9s cubic-bezier(.16,.84,.24,1) .35s both}
@keyframes bootname{from{opacity:0;transform:translateY(14px) scale(1.08)}}
@keyframes bootrule{from{opacity:0;transform:scaleX(0)}}

/* ── the bar: gilt on a track cut on the bend, and a shimmer that never stops ── */
.boot-bar{position:relative;width:236px;height:6px;background:rgba(201,162,39,.14);
  overflow:hidden;clip-path:polygon(4px 0,100% 0,calc(100% - 4px) 100%,0 100%)}
.boot-bar i{display:block;height:100%;width:100%;transform:scaleX(0);transform-origin:left center;
  background:linear-gradient(90deg,var(--m-house,#a3232b),var(--m-or-lo,#8a6a20) 30%,var(--m-or-hi,#e0c169));
  /* a long, late-settling curve, so a big script's jump glides in instead of
     snapping — and so two ticks close together read as one movement. On
     transform, not width (STYLE.md §6⅓): width is laid out, so every tick
     cost a layout and the glide could not run on the compositor. */
  will-change:transform;transition:transform .7s cubic-bezier(.16,.84,.24,1)}
/* THE ONE THING THAT NEVER STOPS. A gilt sweep running the length of the
   track on transform alone, so the compositor keeps drawing it even while
   the main thread is parsing and the bar itself cannot move. */
.boot-bar u{position:absolute;inset:0;display:block;
  background:linear-gradient(90deg,transparent,rgba(255,236,190,.5),transparent);
  transform:translateX(-100%);will-change:transform;
  animation:bootsweep 1.5s linear infinite}
@keyframes bootsweep{to{transform:translateX(100%)}}
.boot-say{font-size:13px;font-style:italic;color:rgba(222,216,200,.5);letter-spacing:.04em}

@media (prefers-reduced-motion:reduce){
  .boot-sun,.boot-bend,.boot-dust i,.boot-bar u,.boot-name,.boot-name::after{animation:none}
  .boot-bend,.boot-dust,.boot-bar u{opacity:0}
  .boot-arms{animation:none;opacity:0;transform:none}
  .boot-arms.me{opacity:1}
}
</style>
<script>
(function(){
  /* IN THE DESKTOP APP THE SHELL DRAWS THIS SCREEN, in a process of its own
     laid over this page (electron/cover.js) — so this page's copy is never
     seen, and drawing it would only slow the parse it exists to cover. */
  if (!window.__coverPage && window.AppCover) {
    var own = document.getElementById('boot');
    if (own) own.style.display = 'none';
  }
  /* the rest of the roll, each coat hung a little before its turn, in step
     with the first (whose turn began when this ran) */
  var t0 = performance.now();
  [].forEach.call(document.querySelectorAll('#boot template.boot-later'), function(t, k){
    var i = k + 1;
    setTimeout(function(){
      var f = t.content.firstElementChild; if (!f) return;
      f.style.animationDelay = (i * 1.8 - (performance.now() - t0) / 1000).toFixed(3) + 's';
      t.parentNode.insertBefore(f, t);
    }, Math.max(0, i * 1800 - 700));
  });
  /* YOUR ARMS FIRST. Nothing that can draw a coat has been read yet, so
     42-shell.js leaves the last one it drew here; the first slot of the roll
     is swapped for it, and the bar wears your livery. */
  try {
    var mine = JSON.parse(localStorage.getItem('monarchy.boot.v1') || 'null');
    var slot = document.querySelector('#boot .boot-arms.me');
    if (mine && mine.svg && slot) {
      slot.innerHTML = mine.svg;
      if (mine.house) document.documentElement.style.setProperty('--m-house', mine.house);
    }
  } catch (e) {}
  /* The words change as the work does, because "Loading..." for eight
     seconds tells you nothing and reads as a hang. */
  var SAY = [[0,'the heralds are summoned\u2026'],[.18,'the roll of arms is read\u2026'],
             [.38,'the banners are hung\u2026'],[.58,'the hearth is lit\u2026'],
             [.78,'the table is laid\u2026']];
  var bar, say, shown = 0;
  /* n and of are BYTES parsed, not files done (see the marker in build.js) */
  window.__boot = function(n, of){
    bar = bar || document.querySelector('#boot .boot-bar i');
    say = say || document.querySelector('#boot .boot-say');
    var u = of ? n / of : 0;
    /* never backwards, and never quite full until the page really is: the
       last few per cent belong to the styles resolving and the first paint,
       which happen after the final script and are not nothing */
    u = Math.max(shown, Math.min(u, 1) * 0.94);
    shown = u;
    if (bar) bar.style.transform = 'scaleX(' + u.toFixed(4) + ')';
    if (say) for (var i = SAY.length - 1; i >= 0; i--)
      if (u >= SAY[i][0]) { say.innerHTML = SAY[i][1]; break; }
    /* and the shell's own copy of this screen (cover.html, electron/cover.js)
       is told how far the parse has got, because it is the one being seen */
    if (!window.__coverPage && window.AppCover) window.AppCover.progress(u);
  };
  /* Gone when the page is actually usable, not when the bar looks full:
     the last script still has to run, styles resolve and the first frame
     paint. Two animation frames after load is that moment. */
  var finishing = false;
  function done(){
    var b = document.getElementById('boot');
    if (!b || finishing) return;
    finishing = true;
    var i = b.querySelector('.boot-bar i');
    if (i) i.style.transform = 'scaleX(1)';
    /* THE TAVERN IS BUILT UNDER THE LOADING SCREEN, not after it. It is the
       same room whichever table is opened, and it was left to the first
       quiet moment in the hall — measured, a 600ms freeze of the hall a few
       seconds after the loading screen had gone (grumkata: "the whole reason
       loading screens exist is to mask the lag"). Here it is behind the
       cover, and the hall that comes up has nothing left to build. */
    var rehearsed = Promise.resolve();
    if (!window.__coverPage) {
      try { if (window.TableBoot && window.TableBoot.warm) window.TableBoot.warm(); } catch (e) {}
      /* AND A TABLE IS LAID ONCE AND PUT AWAY, still under this screen, so
         the first one anybody opens is not the first one ever drawn
         (42-shell.js rehearse — measured, that first draw was the lag).
         Capped: a rehearsal that hangs must not hold the loading screen up. */
      try {
        if (window.Shell && window.Shell.rehearse)
          rehearsed = Promise.race([window.Shell.rehearse(),
                                    new Promise(function(r){ setTimeout(r, 4000); })]);
      } catch (e) {}
    }
    rehearsed.then(function(){
      requestAnimationFrame(function(){ requestAnimationFrame(function(){
        /* a beat on a full bar before it lifts — a bar that vanishes at 94%
           reads as having given up rather than finished */
        setTimeout(function(){
          /* the app is standing: the shell's cover can come off it now */
          if (!window.__coverPage && window.AppCover) window.AppCover.ready();
          b.classList.add('gone');
          setTimeout(function(){ b.remove(); }, 700);
        }, 180);
      }); });
    });
  }
  /* IN THE SHELL'S COVER PAGE this screen is not the page's own — nothing is
     loading in there — so it does not lift on its own 'load'. The shell lifts
     it when the APP says it is ready (electron/cover.js). */
  if (window.__coverPage) { window.__bootDone = done; return; }
  if (document.readyState === 'complete') done();
  else window.addEventListener('load', done);
  /* and never, ever a permanent cover if something above throws */
  setTimeout(done, 25000);
})();
</script>
<script>
(function(){
  var B = window.CoverBridge; if (!B) return;
  var COVER = 440, UNCOVER = 720, host = null;
  var raf2 = function(f){ requestAnimationFrame(function(){ requestAnimationFrame(f); }); };
  function hostUp(){
    if (host) return host;
    host = document.createElement('div'); host.id = 'herald';
    var dust = '';
    for (var i = 0; i < 14; i++) { var r = (i * 0.618034) % 1;
      dust += '<i style="--x:' + (5 + r * 90).toFixed(1) + '%;--s:' + (3 + (i * 7) % 5) + 'px;--d:' +
              (3.4 + (i * 0.37) % 2.2).toFixed(2) + 's;--t:' + (-(i * 0.53) % 3.4).toFixed(2) + 's"></i>'; }
    host.innerHTML = '<div class="hr-veil"><div class="hr-cloth"></div><div class="hr-card">' +
      '<span class="hr-sun"></span><span class="hr-arms"></span><b></b><i></i><u class="hr-work"></u></div>' +
      '</div><div class="hr-dust">' + dust + '</div>';
    var sun = document.getElementById('m-sun');
    if (sun && sun.content) host.querySelector('.hr-sun').appendChild(sun.content.cloneNode(true));
    document.body.appendChild(host);
    return host;
  }
  B.on('boot-progress', function(u){ if (window.__boot) window.__boot(u * 1000, 1000); });
  B.on('boot-done', function(){
    if (window.__bootDone) window.__bootDone();
    /* done() waits two frames and a 180ms beat, then the fade is .5s */
    setTimeout(function(){ B.send('boot-lifted'); }, 900);
  });
  B.on('wipe', function(o){
    o = o || {};
    if (o.house) document.documentElement.style.setProperty('--m-house', o.house);
    var h = hostUp();
    h.classList.remove('lifting', 'carded');
    void h.offsetWidth;                          /* so the veil runs from the start again */
    h.classList.add('wiping');
    setTimeout(function(){
      var c = h.querySelector('.hr-card');
      c.querySelector('b').textContent = o.title || '';
      c.querySelector('i').textContent = o.sub || '';
      var a = c.querySelector('.hr-arms');
      a.innerHTML = o.arms || ''; a.hidden = !o.arms;
      h.classList.add('carded');
      raf2(function(){ B.send('covered'); });
    }, COVER);
  });
  B.on('lift', function(){
    var h = hostUp();
    h.classList.add('lifting');                  /* the card rides out on the cloth */
    setTimeout(function(){ h.classList.remove('wiping', 'lifting', 'carded'); B.send('lifted'); }, UNCOVER + 40);
  });
  /* two frames after load: the first has been drawn, the window can be seen */
  var go = function(){ raf2(function(){ B.send('painted'); }); };
  if (document.readyState === 'complete') go(); else window.addEventListener('load', go);
})();
</script>
