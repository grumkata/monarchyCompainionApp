<!-- proto's own table, unchanged: the slab with its four extruded edges,
     the dice tray, the chat dock (which is also where dice.js builds the
     roller — removing it removed the dice), and the fight's box as a .prop.

     The box starts hidden. It is put on the wood when a combat scene is
     made from the toolbox. -->
<!-- THE TABLE IS A REAL ROUND TABLE NOW. Table_Round_A out of the WoodStuff
     pack (CC0, loafbrr), drawn by 27-table-gl.js into a canvas that sits
     UNDER the props. The .slab below is no longer what you see — it is the
     PLANE: the coordinate space every piece is positioned in, the surface
     shadows fall on, and the thing you grab to pan. It is round and almost
     transparent, and the wood you can see through it is the model.

     Square coordinate space (4400 x 4400 — two units to the millimetre, see
     23-table3d.js) with the table inscribed in it, so
     "the middle" is the middle and a circle has an obvious centre. -->
<div id="vp">
  <!-- THREE LAYERS, IN DEPTH ORDER, and they have to be three.
       The room and the floor are BELOW the table; the table is a real model
       drawn into a canvas; the pieces are DOM on top of it. The floor used to
       live in #tbl with everything else, which was fine while the table was a
       CSS slab in the same stack — put a canvas between them and the floor
       paints straight over the table. #tblu carries the same transform as
       #tbl so the floor still parallaxes with the wood. -->
  <!-- EMPTY ON PURPOSE. This used to hold two CSS floors — a wide pale
       plank layer eight thousand pixels across and a second, different
       board tucked under the table — and they were right for a table
       standing in an abstract dark hall. There is a real floor now: the
       tavern lays its own boards in the GL layer below, from the same pack
       and under the same lights as the walls. Two floors of different woods
       at different brightnesses, one of them a square patch under the
       table, is what grumkata saw as "a different kinda board underneath
       the table compared to the rest of the room". The element stays
       because it carries the table's transform for anything that needs to
       parallax with the wood. -->
  <div id="tblu"></div>
  <canvas id="tglu"></canvas>
  <div id="tbl">
  <div class="slab round" style="width:4400px;height:4400px"></div>
  <!-- the two ends of the horizontal diameter: the GL layer measures these to
       put the model exactly where the plane is, at exactly its size -->
  <div class="tmark" id="tm-l" data-x="0" data-y="2200" data-z="0"></div>
  <div class="tmark" id="tm-r" data-x="4400" data-y="2200" data-z="0"></div>

  <!-- WHERE DICE LAND, AND NOTHING MORE. grumkata: "the dice tray is
       unneccary" — and it was: a slab of felt furniture bolted to the wood
       that you could not move, could not put anything in, and that ate the
       one clear quarter of a round table. Dice roll on the table at a real
       table. The element stays because 34-gl-pieces.js spawns dice relative
       to its rect, which is what keeps them where they landed while you pan
       and zoom; it draws nothing at all now. -->
  <div class="dicetray" style="left:1880px;top:1400px;width:420px;height:290px"></div>

  <!-- THE FIGHT'S BOX. An empty prop exactly the footprint of the board, so the
       camera can frame it, lock onto it and fly to it like any scene. What you
       see on it is drawn by 81-battle-view.js (a real board, through this
       table's own camera) and what you do to it is 82-battle-ui.js. -->
  <div class="prop" id="combat-prop" data-x="150" data-y="150" data-r="0" data-z="8"
       style="--pt:11px;display:none">
    <div class="face bt-face"><span id="combat-name" hidden>Combat</span></div>
  </div>

</div>
  <!-- ══ THE GRADE ════════════════════════════════════════════════
       Everything under here is drawn by two different engines — the wood
       and the models by WebGL, the pieces by the browser as CSS 3D — so
       a post-processing pass on the GL canvases alone would grade half
       the picture and leave the other half raw. The grade has to sit
       ABOVE the composite, which in a hybrid scene means CSS.

       Two layers, not five: everything that can share a blend mode is
       stacked as background layers on one element, which the browser
       paints in a single pass. Only the grain needs its own, because
       overlay is a different operator from soft-light. -->
  <div id="grade" aria-hidden="true"></div>
  <div id="grain" class="m-grain" aria-hidden="true"></div>
</div>

<!-- The table's name, and nothing else. The paragraph of keyboard hints
     that used to live here was a manual printed on the wall: everything in
     it is discoverable by doing it, and none of it belonged on screen for
     the whole of every session. Theme and Fit moved into the menu
     (59-table-menu.js), which is where decisions about this table live. -->
<div class="hud tl">The Table</div>
<div class="hud br"><span class="zl" id="zl">100%</span></div>
<aside class="chatdock">
  <div class="plaque m-band">Chat</div>
  <div class="cb" id="chat-body"></div>
  <div class="cin"><textarea id="chat-in" rows="1" placeholder="Talk, or /r 3 4d6"></textarea><button id="chat-img" class="pic" type="button" title="Send a picture (or paste one, or drop one here)" aria-label="Send a picture"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 19V5a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2zM8.5 13.5l2.5 3 3.5-4.5 4.5 6H5l3.5-4.5z"/></svg></button><button id="chat-go">Send</button><input type="file" id="chat-file" accept="image/*" hidden></div>
</aside>
<!-- ITS OWN ID. It was id="toast" too — and so is the hall's, which comes
     first in the one document, so every table notice (the inspector's, the
     papers', the pocket's, the room editor's) was written into the hall's
     toast, which is display:none at the table. They all said nothing. -->
<div class="toast" id="table-toast"></div>
