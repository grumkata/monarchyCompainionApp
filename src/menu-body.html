

<canvas id="hall"></canvas>
<div id="vig"></div>

<div id="ui">
  <header id="lintel"><h1>Monarchy</h1><div class="rule"></div>
    <div class="sub">the company is mustered</div></header>
  <div id="arms" title="your arms and your name">
    <div class="shield" id="myshield"></div>
    <div class="who">
      <div class="lab">You march as</div>
      <div class="nm unset" id="myname">unnamed</div>
      <div class="edit">click to blazon or upload</div>
    </div>
  </div>
</div>

<section id="screen">
  <div class="cloth"></div><div class="weave"></div>
  <svg class="device" id="device" viewBox="0 0 200 400" preserveAspectRatio="xMidYMid meet"></svg>
  <div class="body" id="screenbody"></div>
</section>
<button class="back" id="back" style="display:none">&#8249;&nbsp; Back to the hall</button>

<div id="scribe" style="display:none">
  <button class="sb" id="undob" title="Undo (Ctrl+Z)">&#8630;</button>
  <button class="sb" id="redob" title="Redo (Ctrl+Shift+Z)">&#8631;</button>
  <button class="sb wide" id="saveb" title="Save now (Ctrl+S)">Save</button>
  <span class="saved" id="saved">saves as you write</span>
</div>
<div class="toast" id="toast"></div>

<input type="file" id="pickT" class="file" accept=".json,.montable,application/json">
<input type="file" id="pickC" class="file" accept=".json,.moncha,.monarch,application/json">
<input type="file" id="pickP" class="file" accept="image/*">
<input type="file" id="pickI" class="file" accept="image/*">
